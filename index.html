<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050e15">
<meta name="description" content="CO2 and O2 apnea tables, max static attempts and live heart rate from a Polar H9.">
<title>Freedive Trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Big+Shoulders+Display:wght@600;800&display=swap">
<style>
:root {
  color-scheme: dark;
  /* Layout: a one-screen phone app (header, one scrolling view, bottom tabs).
     A running session takes the whole screen as a column of water that deepens as the hold goes on. */
  --abyss: #050e15;
  --deep: #0b1822;
  --shelf: #13283a;
  --line: rgba(157, 199, 214, 0.14);
  --ink: #e4eef0;
  --ink-2: #9db3bb;
  --ink-3: #7d959e;
  --sea: #57d6c1;
  --sea-ink: #04201c;
  /* data roles, validated together against --deep */
  --breathe: #21a99c;
  --hold: #5487f5;
  --hold-text: #9ab8ff;
  --heart: #ea5f57;
  --warn: #f2b33d;
  --danger: #ff8d84;
  --display: "Big Shoulders Display", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--abyss); color: var(--ink);
  font-family: var(--body); font-size: 16px; line-height: 1.45;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--sea); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.dd { display: inline-block; width: 0.5em; text-align: center; }
.dc { display: inline-block; width: 0.24em; text-align: center; }

/* ---------- shell ---------- */
#app { height: 100%; display: grid; grid-template-rows: auto 1fr auto; max-width: 560px; margin: 0 auto; }
.top {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: calc(var(--safe-t) + 12px) calc(16px + var(--safe-r)) 10px calc(16px + var(--safe-l));
}
.brand { font-family: var(--display); font-weight: 800; font-size: 23px; letter-spacing: 0.05em; text-transform: uppercase; line-height: 1; }
.brand span { color: var(--ink-3); font-weight: 600; }
.hrchip {
  display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px 0 12px;
  border-radius: 999px; border: 1px solid var(--line); background: var(--deep);
  color: var(--ink-2); font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; white-space: nowrap;
}
.heart { width: 18px; height: 18px; fill: var(--ink-3); flex: none; }
.hrchip .unit { font-weight: 400; color: var(--ink-3); font-size: 12px; margin-left: 3px; }
.hrchip[data-state="connected"] { color: var(--ink); border-color: rgba(234, 95, 87, 0.45); }
.hrchip[data-state="connected"] .heart { fill: var(--heart); animation: beat calc(60s / var(--bpm, 60)) ease-out infinite; }
.hrchip[data-state="connecting"], .hrchip[data-state="reconnecting"], .hrchip[data-state="stale"] { color: var(--warn); border-color: rgba(242, 179, 61, 0.4); }
@keyframes beat { 0% { transform: scale(1); } 14% { transform: scale(1.24); } 30% { transform: scale(1); } }

#views { position: relative; min-height: 0; overflow: hidden; }
.view {
  position: absolute; inset: 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding: 6px calc(16px + var(--safe-r)) 0 calc(16px + var(--safe-l));
  display: none; flex-direction: column; gap: 22px;
}
.view.on { display: flex; }
.view > .tail { height: 8px; flex: none; }

.tabs {
  display: grid; grid-template-columns: repeat(4, 1fr);
  border-top: 1px solid var(--line); background: var(--abyss);
  padding: 4px calc(8px + var(--safe-r)) calc(4px + var(--safe-b)) calc(8px + var(--safe-l));
}
.tab { background: none; border: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 7px 0 6px; color: var(--ink-3); font-size: 12px; font-weight: 700; letter-spacing: 0.02em; }
.tab svg { width: 24px; height: 24px; }
.tab[aria-selected="true"] { color: var(--ink); }
.tab[aria-selected="true"] svg { color: var(--sea); }

/* ---------- type ---------- */
.lede h1 {
  font-family: var(--display); font-weight: 800; font-size: 36px; line-height: 0.95;
  letter-spacing: 0.015em; text-transform: uppercase; margin: 2px 0 10px; text-wrap: balance;
}
.lede p { margin: 0; color: var(--ink-2); max-width: 62ch; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3); }
.sec-h { display: block; font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3); margin: 0 0 8px; }
.help { margin: 0; color: var(--ink-3); font-size: 14px; }
.empty { margin: 0; color: var(--ink-3); }
.err { color: var(--danger) !important; }

/* ---------- controls ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid transparent;
  font-weight: 700; text-decoration: none; background: none; text-align: center;
}
.btn.primary { background: var(--sea); color: var(--sea-ink); }
.btn.primary:active { filter: brightness(0.9); }
.btn.ghost { border-color: var(--line); color: var(--ink); background: rgba(11, 24, 34, 0.6); }
.btn.danger { color: var(--danger); }
.btn.danger-fill { background: #c9443c; color: #fff; }
.btn.big { width: 100%; min-height: 58px; font-size: 18px; }
.btn.sm { min-height: 38px; padding: 0 14px; font-size: 14px; }
.link { background: none; border: 0; padding: 0; color: var(--sea); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }

.seg {
  display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; padding: 4px;
  background: var(--deep); border: 1px solid var(--line); border-radius: 999px;
}
.seg button { border: 0; background: none; border-radius: 999px; min-height: 42px; padding: 0 10px; color: var(--ink-2); font-weight: 700; }
.seg button[aria-checked="true"] { background: var(--shelf); color: var(--ink); box-shadow: inset 0 0 0 1px rgba(157, 199, 214, 0.22); }
.seg.sm { flex: none; }
.seg.sm button { min-height: 34px; font-size: 14px; padding: 0 12px; }

.group { display: flex; flex-direction: column; }
.row, .stepper {
  display: flex; align-items: center; justify-content: space-between; gap: 14px;
  min-height: 60px; padding: 8px 0; border-top: 1px solid var(--line);
}
.group > :last-child { border-bottom: 1px solid var(--line); }
.group > .sec-h + .row, .group > .sec-h + .stepper { border-top: 0; }
.rl { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.rl small { color: var(--ink-3); font-size: 13px; line-height: 1.35; }
.row.wrap { flex-wrap: wrap; justify-content: flex-start; gap: 8px; }
.st-label { color: var(--ink); }
.st-ctl { display: flex; align-items: center; gap: 4px; flex: none; }
.st-btn {
  width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--deep);
  font-size: 22px; line-height: 1; color: var(--ink); display: grid; place-items: center; padding: 0;
}
.st-btn:disabled { opacity: 0.3; cursor: default; }
.st-val { min-width: 6.4em; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
.switch {
  position: relative; width: 52px; height: 32px; flex: none; border-radius: 999px;
  border: 1px solid var(--line); background: var(--shelf); padding: 0;
}
.switch::after {
  content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%;
  background: var(--ink-3); transition: transform 0.18s, background 0.18s;
}
.switch[aria-checked="true"] { background: rgba(87, 214, 193, 0.28); border-color: rgba(87, 214, 193, 0.5); }
.switch[aria-checked="true"]::after { transform: translateX(20px); background: var(--sea); }
.pb-edit { display: flex; align-items: center; gap: 4px; }
.pb-edit input {
  width: 5.2em; height: 44px; text-align: center; font-weight: 700; font-size: 20px; font-variant-numeric: tabular-nums;
  background: var(--deep); border: 1px solid var(--line); border-radius: 12px;
}

.cta {
  position: sticky; bottom: 0; margin-top: auto; z-index: 2;
  padding: 18px 0 16px; background: linear-gradient(to top, var(--abyss) 72%, rgba(5, 14, 21, 0));
}

/* ---------- tables view ---------- */
.profile { margin: 0; display: flex; flex-direction: column; gap: 8px; }
.pf-wrap svg { display: block; width: 100%; height: auto; touch-action: pan-y; }
.pf-air { stroke: var(--breathe); stroke-width: 3; stroke-linecap: round; }
.pf-dip { fill: var(--hold); fill-opacity: 0.16; transition: fill-opacity 0.15s; }
.pf-dip.hi { fill-opacity: 0.4; }
.pf-dive { fill: none; stroke: var(--hold); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.pf-ref { stroke: rgba(157, 199, 214, 0.2); stroke-width: 1; }
.pf-lbl { fill: var(--ink-2); font-size: 11px; font-variant-numeric: tabular-nums; }
.pf-lbl.mute { fill: var(--ink-3); }
.cap { display: flex; justify-content: space-between; align-items: center; gap: 6px 14px; flex-wrap: wrap; font-size: 13px; color: var(--ink-3); }
.legend { display: inline-flex; gap: 6px 14px; align-items: center; flex-wrap: wrap; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.k { display: inline-block; flex: none; }
.k-breathe { width: 14px; height: 3px; border-radius: 2px; background: var(--breathe); }
.k-hold { width: 14px; height: 10px; background: rgba(84, 135, 245, 0.28); border-top: 2px solid var(--hold); }
.k-heart { width: 14px; height: 2px; border-radius: 1px; background: var(--heart); }
.k-con { width: 2px; height: 11px; border-radius: 1px; background: var(--ink); }
.readout { color: var(--ink-2); font-variant-numeric: tabular-nums; }

.dlog { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 15px; }
.dlog th {
  text-align: left; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--ink-3); padding: 0 8px 8px 0; border-bottom: 1px solid var(--line);
}
.dlog td { padding: 9px 8px 9px 0; border-bottom: 1px solid var(--line); }
.dlog td:first-child { color: var(--ink-3); width: 3.2em; }
.dlog td.strong { font-weight: 700; }
.dlog td small { color: var(--ink-3); font-weight: 400; }
.dlog td.short { color: var(--warn); }
.dlog td.na { color: var(--ink-3); }
.dlog tr.hi td { background: rgba(84, 135, 245, 0.1); }
.dlog tfoot td { border-bottom: 0; color: var(--ink-2); padding-top: 11px; }

.adjust summary {
  list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center;
  min-height: 52px; font-weight: 700; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
}
.adjust summary::-webkit-details-marker { display: none; }
.adjust summary::after { content: "+"; font-size: 24px; font-weight: 400; color: var(--ink-3); }
.adjust[open] summary::after { content: "\2212"; }
.adjust[open] summary { border-bottom: 0; }
.adjust .group > :first-child { border-top: 1px solid var(--line); }
.adjust .help { padding: 12px 0 2px; }

/* ---------- max view ---------- */
.pb-hero { display: flex; flex-direction: column; align-items: flex-start; }
.pb-num { font-family: var(--display); font-weight: 800; font-size: clamp(104px, 36vw, 172px); line-height: 0.84; margin: 8px 0 10px; }
.pb-meta { margin: 0; color: var(--ink-2); }
.prog { margin: 0; display: flex; flex-direction: column; gap: 8px; }
.prog-wrap svg { display: block; width: 100%; height: auto; touch-action: pan-y; }
.pg-line { fill: none; stroke: var(--hold); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.pg-dot { fill: var(--hold); stroke: var(--abyss); stroke-width: 2; }
.pg-dot.best { fill: var(--ink); }
.pg-dot.hi { stroke: var(--ink); }
.pg-lbl { fill: var(--ink); font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
.pg-hit { fill: transparent; }
.safety { margin: 0; padding-left: 12px; border-left: 2px solid var(--warn); color: var(--ink-2); font-size: 14px; }

/* ---------- charts ---------- */
.grid { stroke: rgba(157, 199, 214, 0.1); stroke-width: 1; }
.ax { fill: var(--ink-3); font-size: 11px; font-variant-numeric: tabular-nums; }
.hr-band { fill: var(--hold); fill-opacity: 0.15; }
.hr-area { fill: var(--heart); fill-opacity: 0.1; }
.hr-line { fill: none; stroke: var(--heart); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.hr-end { fill: var(--heart); stroke: var(--abyss); stroke-width: 2; }
.hr-endlbl { fill: var(--ink); font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
.hr-min { fill: var(--heart); stroke: var(--abyss); stroke-width: 2; }
.hr-minlbl { fill: var(--ink); font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
.ctick { stroke: var(--ink); stroke-width: 2; stroke-linecap: round; }
.chart-wrap { position: relative; }
.chart-wrap svg { display: block; width: 100%; height: auto; touch-action: pan-y; }
.chart-empty { margin: 0; height: 100%; display: grid; place-items: center; text-align: center; color: var(--ink-3); font-size: 14px; border: 1px dashed var(--line); border-radius: 12px; padding: 0 12px; }
.xh { position: absolute; top: 8px; width: 1px; margin-left: -0.5px; background: rgba(228, 238, 240, 0.55); pointer-events: none; }
.xh-dot { position: absolute; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; background: var(--heart); box-shadow: 0 0 0 2px var(--abyss); pointer-events: none; }

/* ---------- log ---------- */
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chips button {
  border: 1px solid var(--line); background: none; border-radius: 999px; min-height: 38px; padding: 0 14px;
  color: var(--ink-2); font-weight: 700; display: inline-flex; gap: 7px; align-items: center;
}
.chips button span { color: var(--ink-3); font-weight: 400; font-variant-numeric: tabular-nums; }
.chips button[aria-checked="true"] { background: var(--shelf); color: var(--ink); border-color: rgba(157, 199, 214, 0.3); }
.log { display: flex; flex-direction: column; }
.day { font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3); margin: 14px 0 4px; }
.log .day:first-child { margin-top: 0; }
.log-list { list-style: none; margin: 0; padding: 0; }
.log-item {
  width: 100%; display: grid; grid-template-columns: 50px 1fr 18px; column-gap: 12px; row-gap: 2px; align-items: center;
  text-align: left; background: none; border: 0; border-top: 1px solid var(--line); padding: 12px 0;
}
.log-list li:last-child .log-item { border-bottom: 1px solid var(--line); }
.li-tag {
  grid-row: 1 / span 2; justify-self: start; font-size: 12px; font-weight: 700; letter-spacing: 0.06em;
  padding: 4px 8px; border-radius: 8px; border: 1px solid var(--line); color: var(--ink-2);
}
.li-tag.tag-max { background: var(--ink); color: var(--abyss); border-color: var(--ink); }
.li-main { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.li-num { font-family: var(--display); font-weight: 800; font-size: 30px; line-height: 1; }
.li-unit { color: var(--ink-2); font-size: 14px; }
.pb-tag { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; padding: 2px 6px; border-radius: 6px; background: var(--sea); color: var(--sea-ink); }
.li-meta { grid-column: 2; color: var(--ink-3); font-size: 13px; }
.chev { grid-column: 3; grid-row: 1 / span 2; width: 18px; height: 18px; color: var(--ink-3); }

/* ---------- session ---------- */
.session {
  position: fixed; inset: 0; z-index: 40; background: var(--abyss); isolation: isolate; overflow: hidden;
  padding: calc(var(--safe-t) + 10px) calc(16px + var(--safe-r)) calc(var(--safe-b) + 14px) calc(16px + var(--safe-l));
  display: flex; flex-direction: column;
}
.session::before, .session::after { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: -1; }
.session::before {
  background: linear-gradient(180deg, rgba(33, 169, 156, 0.24) 0%, rgba(33, 169, 156, 0.07) 38%, rgba(5, 14, 21, 0) 70%);
  opacity: var(--surf, 1); transition: opacity 1.4s ease;
}
.session::after {
  background: linear-gradient(180deg, rgba(5, 14, 21, 0) 0%, rgba(32, 70, 168, 0.3) 58%, rgba(18, 40, 112, 0.58) 100%);
  opacity: var(--depth, 0); transition: opacity 0.6s linear;
}
.s-inner { width: 100%; max-width: 560px; margin: 0 auto; flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; }
.s-top { display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: 10px; }
.s-x { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: rgba(5, 14, 21, 0.5); display: grid; place-items: center; padding: 0; color: var(--ink-2); }
.s-x svg { width: 20px; height: 20px; }
.s-title { display: flex; flex-direction: column; line-height: 1.2; min-width: 0; }
.s-title b { font-family: var(--display); font-weight: 800; font-size: 21px; text-transform: uppercase; letter-spacing: 0.05em; }
.s-title span { font-size: 13px; color: var(--ink-2); }
.s-hr { display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 24px; font-variant-numeric: tabular-nums; background: none; border: 0; padding: 4px 0 4px 8px; }
.s-hr .heart { fill: var(--heart); }
.s-hr.off { color: var(--ink-3); font-size: 15px; }
.s-hr.off .heart { fill: var(--ink-3); }
.s-hr small { font-size: 12px; color: var(--ink-2); font-weight: 400; }
.s-profile { position: relative; height: 44px; flex: none; }
.s-profile svg { display: block; width: 100%; height: 44px; }
.pf-done { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: rgba(5, 14, 21, 0.6); }
.playhead { position: absolute; top: -2px; bottom: -2px; width: 2px; margin-left: -1px; border-radius: 1px; background: var(--ink); box-shadow: 0 0 0 2px rgba(5, 14, 21, 0.7); }
.s-main {
  flex: 1; min-height: 210px; position: relative; display: grid; grid-template-columns: 70px 1fr; gap: 10px;
  user-select: none; -webkit-user-select: none; touch-action: manipulation; border-radius: 22px; overflow: hidden;
}
.session[data-phase="hold"] .s-main { cursor: pointer; }
.gauge { position: relative; }
.g-track { position: absolute; left: 4px; top: 10px; bottom: 10px; width: 10px; border-radius: 999px; background: rgba(157, 199, 214, 0.12); overflow: hidden; }
.g-fill { position: absolute; left: 0; right: 0; top: 0; height: 0; border-radius: 999px; background: var(--breathe); transition: height 0.12s linear; }
.session[data-phase="hold"] .g-fill { background: var(--hold); }
.session[data-phase="recover"] .g-fill { background: var(--ink-3); }
.g-ticks { position: absolute; left: 0; right: 0; top: 10px; bottom: 10px; }
.tk { position: absolute; left: 26px; transform: translateY(-50%); font-size: 11px; line-height: 1; color: var(--ink-3); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tk::before { content: ""; position: absolute; left: -10px; top: 50%; width: 7px; height: 1px; background: rgba(157, 199, 214, 0.4); }
.tk.end { color: var(--ink-2); font-weight: 700; }
.tk.pb { color: var(--ink); font-weight: 700; }
.tk.pb::before { left: -14px; width: 12px; height: 2px; margin-top: -1px; background: var(--ink); }
.s-read { display: flex; flex-direction: column; justify-content: center; align-items: flex-start; min-width: 0; padding-right: 4px; }
.s-phase { font-family: var(--display); font-weight: 800; font-size: 30px; line-height: 1; letter-spacing: 0.14em; text-transform: uppercase; color: var(--sea); }
.session[data-phase="hold"] .s-phase { color: var(--hold-text); }
.session[data-phase="recover"] .s-phase { color: var(--ink-2); }
.session.paused .s-phase { color: var(--warn); }
.s-time { font-family: var(--display); font-weight: 800; font-size: clamp(92px, 31vw, 180px); line-height: 0.88; margin: 6px 0 8px; white-space: nowrap; }
.session.paused .s-time { opacity: 0.45; }
.hidden-clock { color: var(--ink-3); letter-spacing: 0.1em; }
.s-sub { color: var(--ink-2); font-size: 16px; font-variant-numeric: tabular-nums; }
.s-con { margin-top: 12px; min-height: 1.45em; display: flex; align-items: center; gap: 8px; font-size: 15px; font-variant-numeric: tabular-nums; }
.s-hint { text-align: center; color: var(--ink-3); font-size: 13px; min-height: 2.6em; display: grid; place-items: center; text-wrap: balance; }
.s-chart { height: 96px; flex: none; position: relative; }
.s-chart svg { display: block; width: 100%; height: 96px; }
.s-ctrl .btn.big { min-height: 64px; font-size: 20px; }
#sPrimary.stop { background: var(--ink); color: var(--abyss); }
.s-note { text-align: center; font-size: 12px; color: var(--warn); min-height: 1.3em; }

  for (let i = 0; i < hr.length; i += 2) if (hr[i] >= t0 - 3 && hr[i] <= t1 + 3) pts.push([hr[i], hr[i + 1]]);
  let lo = Infinity, hi = -Infinity;
  pts.forEach(p => { if (p[0] >= t0 && p[0] <= t1) { lo = Math.min(lo, p[1]); hi = Math.max(hi, p[1]); } });
  if (!isFinite(lo)) { lo = 55; hi = 85; }
  let yMin = Math.floor((lo - 3) / 10) * 10, yMax = Math.ceil((hi + 3) / 10) * 10;
  if (yMax - yMin < 30) { const mid = (yMin + yMax) / 2; yMin = Math.floor((mid - 15) / 10) * 10; yMax = yMin + 30; }
  const X = t => P.l + (t - t0) / (t1 - t0) * iw;
  const Y = v => P.t + (1 - (v - yMin) / (yMax - yMin)) * ih;
  const T = x => t0 + (x - P.l) / iw * (t1 - t0);
  const id = 'c' + Math.random().toString(36).slice(2, 8);
  let g = '';
  for (const ph of phases) {
    if (ph.type !== 'hold') continue;
    const a = Math.max(t0, ph.start), b = Math.min(t1, ph.end == null ? t1 : ph.end);
    if (b > a) g += `<rect class="hr-band" x="${X(a).toFixed(1)}" y="${P.t}" width="${(X(b) - X(a)).toFixed(1)}" height="${ih}"/>`;
  }
  let step = 10;
  while ((yMax - yMin) / step > (live ? 3 : 6)) step *= 2;
  for (let v = Math.ceil(yMin / step) * step; v <= yMax; v += step) {
    const y = Y(v).toFixed(1);
    g += `<line class="grid" x1="${P.l}" x2="${W - P.r}" y1="${y}" y2="${y}"/><text class="ax" x="${P.l - 6}" y="${(+y + 4).toFixed(1)}" text-anchor="end">${v}</text>`;
  }
  let line = '', area = '', seg = [], prevT = null;
  const flush = () => {
    if (seg.length > 1) {
      const p = seg.map(q => `${X(q[0]).toFixed(1)},${Y(q[1]).toFixed(1)}`);
      line += 'M' + p.join('L');
      area += `M${X(seg[0][0]).toFixed(1)},${P.t + ih}L${p.join('L')}L${X(seg[seg.length - 1][0]).toFixed(1)},${P.t + ih}Z`;
    }
    seg = [];
  };
  for (const p of pts) { if (prevT != null && p[0] - prevT > 4) flush(); seg.push(p); prevT = p[0]; }
  flush();
  let marks = '';
  for (const c of contractions) if (c >= t0 && c <= t1) marks += `<line class="ctick" x1="${X(c).toFixed(1)}" x2="${X(c).toFixed(1)}" y1="${P.t + 1}" y2="${P.t + 9}"/>`;
  if (live && pts.length) {
    const [lt, lv] = pts[pts.length - 1];
    marks += `<circle class="hr-end" cx="${X(lt).toFixed(1)}" cy="${Y(lv).toFixed(1)}" r="4"/><text class="hr-endlbl" x="${(X(lt) + 8).toFixed(1)}" y="${(Y(lv) + 4).toFixed(1)}">${lv}</text>`;
  }
  if (minLabel) {
    let best = null;
    for (const ph of phases) {
      if (ph.type !== 'hold') continue;
      for (const p of pts) if (p[0] >= ph.start && p[0] <= (ph.end == null ? t1 : ph.end) + 1 && (!best || p[1] < best[1])) best = p;
    }
    if (best) {
      const x = X(best[0]), y = Y(best[1]);
      const below = y < P.t + ih - 20;
      marks += `<circle class="hr-min" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4"/><text class="hr-minlbl" x="${clamp(x, P.l + 26, W - P.r - 26).toFixed(1)}" y="${(below ? y + 18 : y - 9).toFixed(1)}" text-anchor="middle">low ${best[1]}</text>`;
    }
  }
  let xa = '';
  if (!live) {
    const s = niceTimeStep(t1 - t0, 5);
    for (let t = Math.ceil(t0 / s) * s; t <= t1 + 0.01; t += s) {
      const x = X(t);
      xa += `<text class="ax" x="${x.toFixed(1)}" y="${H - 5}" text-anchor="${x < P.l + 12 ? 'start' : x > W - P.r - 14 ? 'end' : 'middle'}">${fmt(t)}</text>`;
    }
  }
  const html = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Heart rate chart"><defs><clipPath id="${id}"><rect x="${P.l}" y="${P.t - 4}" width="${iw}" height="${ih + 8}"/></clipPath></defs>${g}<g clip-path="url(#${id})"><path class="hr-area" d="${area}"/><path class="hr-line" d="${line}"/></g>${marks}${xa}</svg>`;
  return { html, X, Y, T, P, ih };
}
function progressChart(atts, W, H) {
  const P = { l: 40, r: 18, t: 26, b: 24 };
  const iw = W - P.l - P.r, ih = H - P.t - P.b;
  const vals = atts.map(a => a.result);
  const lo = Math.min(...vals), hi = Math.max(...vals);
  const step = niceTimeStep(hi - lo + 40, 4);
  const yMin = Math.max(0, Math.floor((lo - 10) / step) * step);
  let yMax = Math.ceil((hi + 10) / step) * step;
  if (yMax - yMin < step * 2) yMax = yMin + step * 2;
  const n = atts.length;
  const X = i => P.l + (n === 1 ? iw / 2 : i / (n - 1) * iw);
  const Y = v => P.t + (1 - (v - yMin) / (yMax - yMin)) * ih;
  let g = '';
  for (let v = yMin; v <= yMax; v += step) {
    const y = Y(v).toFixed(1);
    g += `<line class="grid" x1="${P.l}" x2="${W - P.r}" y1="${y}" y2="${y}"/><text class="ax" x="${P.l - 6}" y="${(+y + 4).toFixed(1)}" text-anchor="end">${fmt(v)}</text>`;
  }
  const best = vals.indexOf(hi);
  const line = atts.length > 1 ? `<path class="pg-line" d="M${atts.map((a, i) => `${X(i).toFixed(1)},${Y(a.result).toFixed(1)}`).join('L')}"/>` : '';
  const r = n > 40 ? 3 : 4;
  let dots = '', hits = '';
  const hw = Math.max(24, n > 1 ? iw / (n - 1) : iw);
  atts.forEach((a, i) => {
    dots += `<circle class="pg-dot${i === best ? ' best' : ''}" data-i="${i}" cx="${X(i).toFixed(1)}" cy="${Y(a.result).toFixed(1)}" r="${i === best ? r + 1.5 : r}"/>`;
    hits += `<rect class="pg-hit" data-i="${i}" x="${(X(i) - hw / 2).toFixed(1)}" y="0" width="${hw.toFixed(1)}" height="${H}"/>`;
  });
  const bx = clamp(X(best), P.l + 24, W - P.r - 24);
  const lbl = `<text class="pg-lbl" x="${bx.toFixed(1)}" y="${(Y(hi) - 11).toFixed(1)}" text-anchor="middle">PB ${fmt(hi)}</text>`;
  const xa = `<text class="ax" x="${P.l}" y="${H - 5}" text-anchor="start">${esc(dateShort(atts[0].startedAt))}</text>` +
    (n > 1 ? `<text class="ax" x="${W - P.r}" y="${H - 5}" text-anchor="end">${esc(dateShort(atts[n - 1].startedAt))}</text>` : '');
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Max attempts over time">${g}${line}${dots}${lbl}${xa}${hits}</svg>`;
}

let modalKind = null;
function modal({ title, body, actions = [], kind = null, dismissable = true, onOpen = null }) {

function closeModal() { $('#modal').hidden = true; modalKind = null; }
function stepper(key) {

    `<button type="button" class="st-btn" data-step="-1" aria-label="Less: ${d.label}"${v <= d.min ? ' disabled' : ''}>−</button>` +
    `<output class="st-val" aria-labelledby="${id}">${d.show(v)}</output>` +

function switchRow(key, label, sub, on) {

    `<button type="button" class="switch" role="switch" aria-checked="${val}" aria-labelledby="${id}" data-key="${key}"></button></div>`;
}

function drawProfile(rows) {

    title: 'Your backup', body: '<p>Copy all of this text and keep it in a note or file.</p><textarea id="bkText" rows="7" readonly></textarea>',
    actions: [{ label: 'Close', kind: 'primary' }],
    onOpen: () => { const t = $('#bkText'); t.value = data; t.focus(); t.select(); }
  });
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(data).then(() => toast(`Backup of ${n} session${n === 1 ? '' : 's'} copied. Paste it into a note to keep it.`), show);
  } else show();
}
async function importText(text) {
  let obj;
  try { obj = JSON.parse(text); } catch (e) { toast("That isn't a Freedive Trainer backup."); return; }
  const list = Array.isArray(obj) ? obj : obj && Array.isArray(obj.sessions) ? obj.sessions : null;
  if (!list) { toast("That isn't a Freedive Trainer backup."); return; }
  const have = new Set(Store.all().map(s => s.id));
  let added = 0;
  for (const raw of list) {
    const s = sanitizeSession(raw);
    if (s && !have.has(s.id)) { await Store.put(s); have.add(s.id); added++; }
  }
  const st = obj && obj.settings;
  if (st && typeof st.pb === 'number' && isFinite(st.pb) && st.pb > S.pb) {
    S.pb = clamp(Math.round(st.pb), 20, 900);
    S.pbDate = typeof st.pbDate === 'number' && isFinite(st.pbDate) ? st.pbDate : null;
    saveSettings();
  }
  renderAll();
  toast(added ? `Restored ${added} session${added === 1 ? '' : 's'}` : 'Nothing new in that backup');
}
function pasteImport() {
  modal({
    title: 'Paste backup', body: '<p>Paste the backup text you copied earlier.</p><textarea id="pasteBox" rows="7" placeholder="{&quot;app&quot;:&quot;freedive-trainer&quot;, …}"></textarea>',
    actions: [{ label: 'Cancel', kind: 'ghost' }, { label: 'Restore', kind: 'primary', onClick: () => { importText($('#pasteBox').value); } }]
  });
}
function confirmWipe() {
  const n = Store.all().length;
  if (!n) { toast('There are no sessions to delete.'); return; }
  modal({
    title: 'Delete all sessions?',
    body: `<p>All ${n} session${n === 1 ? '' : 's'} will be removed from this browser. Your PB and settings stay. Make a backup first if you might want them back.</p>`,
    actions: [{ label: 'Cancel', kind: 'ghost' }, { label: 'Delete all', kind: 'danger-fill', onClick: () => { Store.clear().then(() => { renderAll(); toast('All sessions deleted'); }); } }]
  });
}

/* ================= first run ================= */
function onboarding() {
  modal({
    title: 'Before you start',
    dismissable: false,
    body: `<ul><li>Do these tables dry, lying down on a bed or mat.</li><li>Never practise breath-holds in or near water without a trained buddy watching you, and never while driving.</li><li>Stop a hold if you feel tingling, tunnel vision or confusion.</li></ul>
      <div class="ob-pb"><label for="obPb">Your max breath-hold</label><div class="pb-edit"><button type="button" class="st-btn" data-ob="-5" aria-label="5 seconds less">−</button><input id="obPb" inputmode="numeric" autocomplete="off" value="${fmt(S.pb)}"><button type="button" class="st-btn" data-ob="5" aria-label="5 seconds more">+</button></div></div>
      <p>Not sure? Make a guess, then do a max attempt on the Max tab. It updates this for you.</p>`,
    actions: [{
      label: 'Start training', kind: 'primary', onClick: () => {
        const v = parseTime($('#obPb').value);
        if (v != null && v >= 20 && v <= 900 && v !== S.pb) { S.pb = v; S.pbDate = null; }
        S.safetyAck = true; saveSettings(); renderAll();
      }
    }],
    onOpen: m => m.querySelectorAll('[data-ob]').forEach(b => b.addEventListener('click', () => {
      const i = $('#obPb');
      i.value = fmt(clamp((parseTime(i.value) || S.pb) + Number(b.dataset.ob), 20, 900));
    }))
  });
}

/* ================= wiring ================= */
const ACTIONS = {
  tableType: v => { S.tableType = v; saveSettings(); renderTables(); },
  startTable: () => Run.startTable(),
  startMax: () => Run.startMax(),
  callouts: v => { S.max.callouts = +v; saveSettings(); renderMax(); },
  goto: v => setTab(v),
  sensor: () => { if (HR.st.status === 'idle' && HR.supported() && !HR.st.error && Run.active()) { HR.connect(); return; } openSensor(); },
  testCues: () => { Sound.unlock(); Sound.hold(); Voice.say('Hold'); Haptics.buzz(220); },
  export: () => doExport(),
  pasteImport: () => pasteImport(),
  wipe: () => confirmWipe(),
  pbStep: v => { S.pb = clamp(S.pb + Number(v), 20, 900); S.pbDate = null; saveSettings(); const i = $('#pbInput'); if (i) i.value = fmt(S.pb); },
  logFilter: v => { S.ui.logFilter = v; saveSettings(); renderLog(); }
};
function wire() {
  document.addEventListener('click', e => {
    const tab = e.target.closest('.tab');
    if (tab) { setTab(tab.dataset.tab); return; }
    const stb = e.target.closest('.stepper .st-btn');
    if (stb) {
      const key = stb.closest('.stepper').dataset.key, d = STEPS[key];
      let v = clamp(getPath(S, key) + d.inc * Number(stb.dataset.step), d.min, d.max);
      if (key === 'o2.firstPct') v = Math.min(v, S.o2.lastPct - 5);
      if (key === 'o2.lastPct') v = Math.max(v, S.o2.firstPct + 5);
      setPath(S, key, v); saveSettings();
      const focusKey = key, focusStep = stb.dataset.step;
      VIEWS[S.tab]();
      const again = $(`.stepper[data-key="${focusKey}"] .st-btn[data-step="${focusStep}"]`);
      if (again && !again.disabled) again.focus({ preventScroll: true });
      return;
    }
    const sw = e.target.closest('.switch');
    if (sw) {
      const key = sw.dataset.key;
      if (key === 'sim') { HR.simulate(!HR.st.simulated); return; }
      setPath(S, key, !getPath(S, key)); saveSettings();
      sw.setAttribute('aria-checked', String(getPath(S, key)));
      if (key === 'wakeLock' && !S.wakeLock) Awake.off();
      return;
    }
    const li = e.target.closest('.log-item');
    if (li) { const s = Store.all().find(x => x.id === li.dataset.id); if (s) openDetail(s); return; }
    const act = e.target.closest('[data-act]');
    if (act && ACTIONS[act.dataset.act]) ACTIONS[act.dataset.act](act.dataset.v);
  });
  document.addEventListener('change', e => {
    if (e.target.id === 'pbInput') {
      const v = parseTime(e.target.value);
      if (v != null && v >= 20 && v <= 900) { S.pb = v; S.pbDate = null; saveSettings(); toast(`PB set to ${fmt(v)}. Tables rebuilt.`); }
      else toast('Type the time as minutes:seconds, like 3:30.');
      e.target.value = fmt(S.pb);
    } else if (e.target.id === 'importFile') {
      const f = e.target.files && e.target.files[0];
      if (f) f.text().then(importText).catch(() => toast("Couldn't read that file."));
      e.target.value = '';
    }
  });
  document.addEventListener('toggle', e => {
    if (e.target.classList && e.target.classList.contains('adjust')) { S.ui.adjustOpen = e.target.open; saveSettings(); }
  }, true);
  $('#sPrimary').addEventListener('click', () => Run.primary());
  $('#sClose').addEventListener('click', endSessionPrompt);
  let lastTap = 0;
  $('#sMain').addEventListener('pointerdown', e => {
    if (e.button > 0) return;
    const t = performance.now();
    if (t - lastTap < 250) return;
    lastTap = t;
    if (Run.contraction()) { const b = $('#sMain').getBoundingClientRect(); ripple(e.clientX - b.left, e.clientY - b.top); }
  });
  $('#dBack').addEventListener('click', closeDetail);
  $('#dDel').addEventListener('click', deleteCurrent);
  $('#modal').addEventListener('click', e => { if (e.target.id === 'modal' && $('#modal').dataset.dismiss) closeModal(); });
  document.addEventListener('keydown', e => {
    if (!$('#modal').hidden) { if (e.key === 'Escape' && $('#modal').dataset.dismiss) closeModal(); return; }
    if (Run.active()) {
      if (e.key === ' ' || e.code === 'Space') {
        e.preventDefault();
        if (Run.contraction()) { const b = $('#sMain').getBoundingClientRect(); ripple(b.width * 0.6, b.height / 2); }
      } else if (e.key === 'Enter') { e.preventDefault(); Run.primary(); }
      else if (e.key === 'Escape') endSessionPrompt();
      return;
    }
    if (!$('#detail').hidden && e.key === 'Escape') closeDetail();
  }, true);
  // a focused button would otherwise also fire on Space release
  document.addEventListener('keyup', e => { if (Run.active() && $('#modal').hidden && (e.key === ' ' || e.code === 'Space')) e.preventDefault(); }, true);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && Run.active()) Run.tick(); });
  let rz = null;
  window.addEventListener('resize', () => {
    clearTimeout(rz);
    rz = setTimeout(() => {
      const r = Run.state();
      if (r) { if (r.plan) drawSessionProfile(r); drawLiveChart(r); }
      else if ($('#detail').hidden) VIEWS[S.tab]();
      else { const s = Store.all().find(x => x.id === detailId); if (s && $('#dChart')) mountDetailChart(s); }
    }, 150);
  });
  window.addEventListener('beforeunload', e => { if (Run.active()) { e.preventDefault(); e.returnValue = ''; } });
  setInterval(() => { if (HR.st.status === 'connected') { renderHrChip(); if (Run.active()) updateSessionHr(); } }, 1000);
}
function pwa() {
  if (FRAMED || location.protocol !== 'https:') return;
  const add = (rel, href) => { const l = document.createElement('link'); l.rel = rel; l.href = href; document.head.appendChild(l); };
  add('manifest', 'manifest.webmanifest');
  add('apple-touch-icon', 'icon-192.png');
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* ignore */ }
}
async function boot() {
  wire();
  await Store.init();
  await recoverLive();
  setTab(S.tab);
  renderHrChip();
  if (!S.safetyAck) onboarding();
  pwa();
}
boot();
})();
</script>
</body>
